<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chef-Übersicht</title>
<style>
:root{--bg:#000;--s1:#0b0b0e;--s2:#131318;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.16);--tx:#f3f3f7;--mute:#8a8a98;--acc:#8b7bff;--accg:rgba(139,123,255,.18);--pos:#3ddc97;--neg:#ff5d6c;--warn:#ffb454;color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{background:#000}
body{margin:0;min-height:100vh;color:var(--tx);font:500 14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;
 background:radial-gradient(900px 420px at 80% -120px,rgba(139,123,255,.16),transparent 70%),radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 0/26px 26px,#000;background-attachment:fixed}
::selection{background:var(--acc);color:#000}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#26262e;border-radius:9px}::-webkit-scrollbar-track{background:transparent}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:14px;padding:12px 28px;background:rgba(0,0,0,.72);backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border:1.5px dashed #4a4a58;border-radius:10px;display:grid;place-items:center;font-size:9px;letter-spacing:.06em;color:var(--mute)}
.brand{font-weight:800;font-size:16px;line-height:1.2;letter-spacing:.01em}.brand small{display:block;font-weight:500;font-size:12px;color:var(--mute)}
.sp{flex:1}
button{font:inherit;color:inherit;cursor:pointer}
.btn{background:#fff;color:#000;border:0;border-radius:10px;padding:9px 16px;font-weight:700;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(255,255,255,.18)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line2)}.btn.ghost:hover{border-color:#fff;box-shadow:none}
.btn.danger{background:transparent;color:var(--neg);border:1px solid rgba(255,93,108,.35)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:1360px;margin:auto;padding:24px 28px 60px;display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.card{grid-column:span 12;position:relative;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:18px;padding:20px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 20px 50px -30px #000}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent)}
.c4{grid-column:span 4}.c3{grid-column:span 3}.c8{grid-column:span 8}
h2{margin:0 0 14px;font-size:13px;font-weight:600;color:var(--mute);letter-spacing:.02em}
.hint{color:var(--mute);font-size:13px;margin:0 0 12px}
.logo{cursor:pointer;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}#bn{outline:0;cursor:text}
/* import */
#imp{display:none}#imp.open{display:block;animation:in .25s ease}
textarea{width:100%;min-height:150px;resize:vertical;background:#050507;color:var(--tx);border:1px solid var(--line2);border-radius:12px;padding:14px;font:500 13px/1.6 ui-monospace,Menlo,Consolas,monospace}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
#res{font-size:13px;color:var(--mute)}#res b{color:var(--pos)}#res i{font-style:normal;color:var(--warn)}
/* hero */
.hero{display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(420px 260px at 0% 0%,var(--accg),transparent 70%),linear-gradient(180deg,var(--s2),var(--s1))}
.big{font-size:clamp(38px,5vw,58px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:2px 0 6px}
.big.neg{color:var(--neg)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:3px 11px;background:rgba(61,220,151,.12);color:var(--pos)}
.pill.neg{background:rgba(255,93,108,.12);color:var(--neg)}
.mini{display:grid;gap:0;margin-top:18px}
.mini div{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);color:var(--mute)}.mini b{color:var(--tx);font-weight:600}
svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12px;color:var(--mute);margin-top:8px}.legend s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;text-decoration:none}
/* donut */
.donut{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:none}
.ring div{width:112px;height:112px;border-radius:50%;background:var(--s1);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mute);line-height:1.2}.ring b{display:block;font-size:30px;color:var(--tx);font-weight:800}
.lg div{display:flex;align-items:center;gap:8px;margin:5px 0;color:var(--mute)}.lg s{width:10px;height:10px;border-radius:50%;display:inline-block}.lg b{color:var(--tx);margin-left:auto;padding-left:18px}
/* bars */
.bars{display:flex;align-items:flex-end;gap:4px;height:150px;padding-top:6px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0;position:relative}
.bc i{display:block;width:100%;height:var(--h);min-height:2px;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,var(--acc),rgba(139,123,255,.25));transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transition:filter .15s}
.bc:hover i{filter:brightness(1.4)}.bc.z i{background:#1d1d24}
.bc span{font-size:10.5px;color:var(--mute);height:14px;white-space:nowrap}
.bc:hover::after{content:attr(data-t);position:absolute;bottom:calc(100% - 4px);left:50%;transform:translateX(-50%);background:#fff;color:#000;font-size:11px;font-weight:700;padding:2px 8px;border-radius:7px;white-space:nowrap;z-index:3}
/* highlights */
.k{display:flex;flex-direction:column;gap:2px}.k .v{font-size:24px;font-weight:800;letter-spacing:-.02em}.k small{color:var(--mute)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}
/* table */
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.tools input{flex:1;min-width:180px;background:#050507;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;color:var(--tx);font:inherit}
.chips{display:flex;gap:6px}.chips button{background:transparent;border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--mute)}.chips button.on{background:#fff;color:#000;border-color:#fff;font-weight:700}
.wrap{overflow:auto;max-height:540px;border-radius:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;min-width:860px}
th{position:sticky;top:0;background:#0d0d11;text-align:left;font-size:12px;font-weight:600;color:var(--mute);padding:11px 14px;cursor:pointer;user-select:none;white-space:nowrap;border-bottom:1px solid var(--line2)}
th:hover{color:#fff}th.on::after{content:attr(data-d);color:var(--acc);margin-left:5px}
td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{transition:background .15s}tbody tr:hover{background:rgba(255,255,255,.035)}
td.n,th.n{text-align:right}td.code{font-weight:700}
.tag{font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px}
.t0{background:rgba(255,180,84,.12);color:var(--warn)}.t1{background:var(--accg);color:#b4a9ff}.t2{background:rgba(61,220,151,.12);color:var(--pos)}
.empty{text-align:center;padding:50px 10px;color:var(--mute)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#fff;color:#000;font-weight:700;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}
@keyframes grow{from{transform:scaleY(0)}}@keyframes in{from{opacity:0;transform:translateY(-6px)}}
@media (max-width:1000px){.c4,.c3,.c8{grid-column:span 12}.c3{grid-column:span 6}}
@media (max-width:560px){header,main{padding-left:14px;padding-right:14px}.c3{grid-column:span 12}.btn{padding:8px 12px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo" id="logo" title="Logo ändern">LOGO</div><input type="file" id="lf" accept="image/*" hidden>
  <div class="brand"><span id="bn" contenteditable="true" spellcheck="false" title="Firmenname ändern">FIRMENNAME</span><small>Chef-Übersicht</small></div>
  <div class="sp"></div>
  <button class="btn ghost" id="csv" type="button">CSV exportieren</button>
  <button class="btn" id="tog" type="button">Steckbriefe einfügen</button>
</header>

<main>
  <section class="card" id="imp">
    <h2>Steckbriefe einfügen</h2>
    <p class="hint">Alle Steckbriefe der Mitarbeiter untereinander einfügen. Ein Auftrag, der schon da ist (gleicher Lagercode), wird mit den neuen Angaben ergänzt, leere Felder bleiben unverändert.</p>
    <textarea id="ta" placeholder="lagercode=LC-000001&#10;status=Verkauft&#10;preisvorgabe=2 bis 6 euro&#10;online seit=19:20 am 6.10.2026&#10;..." spellcheck="false"></textarea>
    <div class="bar">
      <button class="btn" id="go" type="button">Einlesen</button>
      <button class="btn ghost" id="demo" type="button">Beispieldaten laden</button>
      <button class="btn danger" id="wipe" type="button">Alles löschen</button>
      <span id="res"></span>
    </div>
  </section>
  <div id="app" style="display:contents"></div>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const KEY = "rs_chef_v1", $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = n => n.toLocaleString("de-DE", { style: "currency", currency: "EUR" });
const fdt = ms => new Date(ms).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
const dur = ms => { const m = Math.round(ms / 6e4), d = Math.floor(m / 1440), h = Math.floor(m % 1440 / 60); return d ? d + " Tg. " + h + " Std." : h ? h + " Std. " + (m % 60) + " Min." : m + " Min."; };
const dayKey = ms => { const d = new Date(ms); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
let items = [], view = { q: "", st: "alle", key: "sold", dir: -1, days: 0 };
const rangeCut = () => { if (!view.days) return 0; const d = new Date(); d.setHours(0, 0, 0, 0); return d.getTime() - (view.days - 1) * 864e5; };
const scoped = () => { const c = rangeCut(); return items.filter(i => !i.sold || i.sold >= c); };
try { items = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) {}
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {} };
function toast(t) { const e = $("toast"); e.textContent = t; e.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => e.classList.remove("show"), 2200); }

/* ---------- Einlesen ---------- */
const num = s => { let t = String(s).replace(/euro|eur|€/gi, "").trim(); t = t.includes(",") || /^\d{1,3}(\.\d{3})+$/.test(t) ? t.replace(/\./g, "").replace(",", ".") : t; const v = parseFloat(t); return isNaN(v) ? null : v; };
function stamp(s) { const m = /(\d{1,2}):(\d{2})(?::\d{2})?\s*(?:uhr)?\s*(?:am\s*)?(\d{1,2})\.(\d{1,2})\.(\d{2,4})/i.exec(s); return m ? new Date(m[5].length < 4 ? 2000 + +m[5] : +m[5], +m[4] - 1, +m[3], +m[1], +m[2]).getTime() : null; }
function parse(text) {
  const recs = []; let r = null, ignored = 0;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim(); if (!line || /^-{3,}$/.test(line)) continue;
    const p = line.indexOf("="); if (p < 1) { ignored++; continue; }
    const k = line.slice(0, p).trim().toLowerCase(), v = line.slice(p + 1).trim();
    if (k === "lagercode") { r = { code: v }; recs.push(r); continue; }
    if (!r) { ignored++; continue; }
    if (k === "preisvorgabe") { const m = /(.+?)\s+bis\s+(.+)/.exec(v); if (m) { r.min = num(m[1]); r.max = num(m[2]); } }
    else if (k === "online seit") r.on = stamp(v);
    else if (k === "verkauft um") r.sold = stamp(v);
    else if (k === "einkaufspreis") r.buy = num(v);
    else if (k === "verkaufspreis") r.sp = num(v);
    else if (k === "versandkosten") r.ship = num(v);
    else if (k === "status") r.stat = v.toLowerCase();
    else if (k === "lagercode in beschreibung") r.desc = /^(ja|yes|true|1)/i.test(v);
    else if (k === "im preisrahmen") r.inr = /^(ja|yes|true|1)/i.test(v);
    else if (k === "gewinn") r.g = num(v);
    else if (k !== "standzeit") ignored++;
  }
  return { recs: recs.filter(x => x.code), ignored, skipped: recs.filter(x => !x.code).length };
}
function merge(recs) {
  items = items.filter(x => !x.d);
  let nw = 0, up = 0;
  for (const r of recs) {
    const i = items.findIndex(x => x.code.toLowerCase() === r.code.toLowerCase());
    if (i >= 0) { Object.keys(r).forEach(k => { if (r[k] != null && r[k] !== "") items[i][k] = r[k]; }); up++; } else { items.push(r); nw++; }
  }
  persist(); return { nw, up };
}

/* ---------- Auswertung ---------- */
const profit = i => i.sp != null && i.sold ? i.sp - (i.buy || 0) - (i.ship || 0) : null;
const state = i => i.sold && i.sp != null ? 2 : i.on ? 1 : 0;
const ST = ["Offen", "Online", "Verkauft"], COL = ["#ffb454", "#8b7bff", "#3ddc97"];
const outRange = i => i.sp != null && (i.inr != null ? !i.inr : ((i.min != null && i.sp < i.min) || (i.max != null && i.sp > i.max)));

function stats(list) {
  const sold = list.filter(i => state(i) === 2);
  const sum = f => sold.reduce((a, i) => a + (f(i) || 0), 0);
  const rev = sum(i => i.sp), cost = sum(i => i.buy), ship = sum(i => i.ship), gain = rev - cost - ship;
  const times = sold.filter(i => i.on && i.sold >= i.on).map(i => ({ i, d: i.sold - i.on }));
  return { sold, rev, cost, ship, gain, margin: rev ? gain / rev * 100 : 0, avgT: times.length ? times.reduce((a, t) => a + t.d, 0) / times.length : null, times,
    cnt: [0, 1, 2].map(s => list.filter(i => state(i) === s).length) };
}

/* ---------- Diagramme ---------- */
function timeline(sold) {
  const days = {}; sold.forEach(i => { const k = dayKey(i.sold); days[k] = days[k] || { rev: 0, g: 0, t: new Date(i.sold).setHours(0, 0, 0, 0) }; days[k].rev += i.sp; days[k].g += profit(i); });
  const ks = Object.keys(days).sort(); if (!ks.length) return '<div class="empty">Noch keine Verkäufe.</div>';
  const t0 = days[ks[0]].t, t1 = days[ks[ks.length - 1]].t, n = Math.round((t1 - t0) / 864e5) + 1;
  const rows = []; let cum = 0;
  for (let d = 0; d < n; d++) { const k = dayKey(t0 + d * 864e5 + 36e5 * 12), x = days[k] || { rev: 0, g: 0 }; cum += x.g; rows.push({ k, rev: x.rev, cum }); }
  const W = 700, H = 240, L = 52, R = 12, T = 12, B = 26, pw = W - L - R, ph = H - T - B;
  const hi = Math.max(1, ...rows.map(r => Math.max(r.rev, r.cum))), lo = Math.min(0, ...rows.map(r => r.cum)), span = hi - lo;
  const y = v => T + ph - (v - lo) / span * ph, sx = pw / n, cx = d => L + sx * (d + .5);
  const grid = [0, 1, 2, 3].map(g => { const v = lo + span * g / 3; return `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.07)"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" fill="#8a8a98" font-size="11">${Math.round(v)} €</text>`; }).join("");
  const bars = rows.map((r, d) => `<rect x="${cx(d) - Math.min(sx * .6, 26) / 2}" y="${y(r.rev)}" width="${Math.min(sx * .6, 26)}" height="${Math.max(0, y(0) - y(r.rev))}" rx="4" fill="rgba(255,255,255,.16)"><title>${r.k}: Umsatz ${eur(r.rev)}</title></rect>`).join("");
  const pts = rows.map((r, d) => [cx(d), y(r.cum)]);
  const line = pts.map((p, d) => (d ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L${pts[pts.length - 1][0]} ${y(lo)} L${pts[0][0]} ${y(lo)}Z`;
  const dots = pts.map((p, d) => `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#000" stroke="#8b7bff" stroke-width="2"><title>${rows[d].k}: Gewinn gesamt ${eur(rows[d].cum)}</title></circle>`).join("");
  const fl = k => k.split("-").reverse().join(".");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Umsatz pro Tag und Gewinn gesamt"><defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b7bff" stop-opacity=".4"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/></linearGradient></defs>${grid}${bars}<path d="${area}" fill="url(#ag)"/><path d="${line}" fill="none" stroke="#8b7bff" stroke-width="2.5" stroke-linejoin="round"/>${dots}<text x="${L}" y="${H - 6}" fill="#8a8a98" font-size="11">${fl(rows[0].k)}</text>${rows.length > 2 ? `<text x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle" fill="#8a8a98" font-size="11">${fl(rows[rows.length >> 1].k)}</text>` : ""}<text x="${W - R}" y="${H - 6}" text-anchor="end" fill="#8a8a98" font-size="11">${fl(rows[rows.length - 1].k)}</text></svg>
  <div class="legend"><span><s style="background:rgba(255,255,255,.3)"></s>Umsatz pro Tag</span><span><s style="background:#8b7bff"></s>Gewinn gesamt</span></div>`;
}
function bars(vals, labels, unit) {
  const mx = Math.max(1, ...vals);
  return '<div class="bars">' + vals.map((v, i) => `<div class="bc${v ? "" : " z"}" data-t="${labels[i][1]}: ${v} ${unit}"><i style="--h:${v / mx * 100}%"></i><span>${labels[i][0]}</span></div>`).join("") + "</div>";
}

/* ---------- Seite ---------- */
function render() {
  const app = $("app");
  if (!items.length) { app.innerHTML = '<section class="card"><div class="empty">Noch keine Daten.<br>Klicke oben auf „Steckbriefe einfügen“ oder lade die Beispieldaten.</div></section>'; return; }
  const list = scoped(), s = stats(list), sold = s.sold;
  const hours = Array(24).fill(0), wd = Array(7).fill(0), bk = [0, 0, 0, 0, 0];
  sold.forEach(i => { const d = new Date(i.sold); hours[d.getHours()]++; wd[(d.getDay() + 6) % 7]++; });
  s.times.forEach(t => { const d = t.d / 864e5; bk[d < 1 ? 0 : d < 3 ? 1 : d < 7 ? 2 : d < 14 ? 3 : 4]++; });
  const WD = ["Mo", "Di", "Mi", "Do", "Fr", "Sa", "So"], BL = ["< 1 Tag", "1–3 Tage", "3–7 Tage", "7–14 Tage", "14+ Tage"];
  const best = sold.slice().sort((a, b) => profit(b) - profit(a))[0], fast = s.times.slice().sort((a, b) => a.d - b.d)[0];
  const loss = sold.filter(i => profit(i) < 0), oor = sold.filter(outRange), total = list.length;
  let acc = 0; const conic = s.cnt.map((c, i) => { const a = acc; acc += c / total * 100; return COL[i] + " " + a + "% " + acc + "%"; }).join(",");
  const gcls = s.gain < 0 ? " neg" : "";
  const now = Date.now(), stale = list.filter(i => state(i) === 1 && now - i.on > 7 * 864e5).sort((a, b) => a.on - b.on), idle = list.filter(i => state(i) === 0), nodesc = list.filter(i => i.desc === false), bad = list.filter(i => (i.sold && i.sp == null) || (i.sp != null && !i.sold) || (i.stat === "verkauft" && state(i) !== 2) || (i.g != null && profit(i) != null && Math.abs(i.g - profit(i)) > .005));
  const bar = (items.some(x => x.d) ? '<section class="card"><p class="hint" style="margin:0">Beispieldaten – werden beim ersten echten Import automatisch ersetzt.</p></section>' : "") + `<section class="card" style="padding:12px 20px"><div class="tools" style="margin:0"><span class="hint" style="margin:0">Zeitraum</span><div class="chips">${[[1, "Heute"], [7, "7 Tage"], [30, "30 Tage"], [0, "Alles"]].map(([d, n]) => `<button type="button" data-days="${d}" class="${view.days === d ? "on" : ""}">${n}</button>`).join("")}</div></div></section>`;
  app.innerHTML = `
  ${bar}<section class="card c4 hero"><div><h2>Gewinn gesamt</h2><div class="big${gcls}" id="big" data-v="${s.gain}">${eur(s.gain)}</div><span class="pill${gcls}">${s.margin.toFixed(1).replace(".", ",")} % Marge</span></div>
    <div class="mini"><div>Umsatz<b>${eur(s.rev)}</b></div><div>Einkauf<b>${eur(s.cost)}</b></div><div>Versand<b>${eur(s.ship)}</b></div><div>Ø Gewinn pro Verkauf<b>${sold.length ? eur(s.gain / sold.length) : "–"}</b></div><div>Ø Standzeit<b>${s.avgT != null ? dur(s.avgT) : "–"}</b></div></div></section>
  <section class="card c8"><h2>Verlauf</h2>${timeline(sold)}</section>
  <section class="card c4"><h2>Status der Aufträge</h2><div class="donut"><div class="ring" style="background:conic-gradient(${conic})"><div><span><b>${total}</b>Aufträge</span></div></div>
    <div class="lg" style="flex:1;min-width:130px">${ST.map((n, i) => `<div><s style="background:${COL[i]}"></s>${n}<b>${s.cnt[i]}</b></div>`).join("")}</div></div></section>
  <section class="card c8"><h2>Verkäufe nach Uhrzeit</h2>${bars(hours, hours.map((_, h) => [h % 2 === 0 ? h : "", h + ":00 Uhr"]), "Verkäufe")}</section>
  <section class="card c4"><h2>Verkäufe nach Wochentag</h2>${bars(wd, WD.map(w => [w, w]), "Verkäufe")}</section>
  <section class="card c4"><h2>Wie lange bis zum Verkauf</h2>${bars(bk, BL.map(b => [b.replace(" Tage", "").replace(" Tag", ""), b]), "Verkäufe")}</section>
  <section class="card c4"><h2>Handlungsbedarf</h2><div class="lg"><div><s style="background:var(--warn)"></s>Noch nicht online<b>${idle.length}</b></div><div><s style="background:var(--neg)"></s>Online seit über 7 Tagen<b>${stale.length}</b></div><div><s style="background:var(--acc)"></s>Daten prüfen<b>${bad.length}</b></div><div><s style="background:var(--mute)"></s>Lagercode fehlt in Beschreibung<b>${nodesc.length}</b></div></div><p class="hint" style="margin:12px 0 0">${stale.length ? "Älteste: " + stale.slice(0, 3).map(i => esc(i.code) + " (" + dur(now - i.on) + ")").join(", ") : "Keine Ladenhüter"}${bad.length ? " · Prüfen: " + bad.slice(0, 3).map(i => esc(i.code)).join(", ") : ""}</p></section>
  <section class="card c3 k"><h2>Bester Verkauf</h2><div class="v pos">${best ? eur(profit(best)) : "–"}</div><small>${best ? esc(best.code) : "Noch kein Verkauf"}</small></section>
  <section class="card c3 k"><h2>Schnellster Verkauf</h2><div class="v">${fast ? dur(fast.d) : "–"}</div><small>${fast ? esc(fast.i.code) : "Noch kein Verkauf"}</small></section>
  <section class="card c3 k"><h2>Verlust-Verkäufe</h2><div class="v ${loss.length ? "neg" : ""}">${loss.length}</div><small>${loss.length ? eur(loss.reduce((a, i) => a + profit(i), 0)) + " insgesamt" : "Keine Verluste"}</small></section>
  <section class="card c3 k"><h2>Außerhalb Preisvorgabe</h2><div class="v ${oor.length ? "warn" : ""}">${oor.length}</div><small>${oor.length ? oor.slice(0, 3).map(i => esc(i.code)).join(", ") : "Alle im Rahmen"}</small></section>
  <section class="card"><h2>Aufträge <span id="cnt" style="color:var(--tx)"></span></h2><div class="tools"><input id="q" placeholder="Lagercode suchen" value="${esc(view.q)}" autocomplete="off"><div class="chips">${["alle", "Offen", "Online", "Verkauft"].map(c => `<button type="button" data-st="${c}" class="${view.st === c ? "on" : ""}">${c === "alle" ? "Alle" : c}</button>`).join("")}</div></div><div class="wrap" id="tbl"></div></section>`;
  table(); countUp();
}
const COLS = [["code", "Lagercode", i => i.code], ["st", "Status", i => state(i)], ["on", "Online seit", i => i.on || 0], ["sold", "Verkauft um", i => i.sold || 0], ["t", "Standzeit", i => i.on && i.sold ? i.sold - i.on : -1],
  ["buy", "Einkauf", i => i.buy ?? -1e9], ["sp", "Verkauf", i => i.sp ?? -1e9], ["ship", "Versand", i => i.ship ?? -1e9], ["g", "Gewinn", i => profit(i) ?? -1e9]];
function table() {
  const q = view.q.toLowerCase(), c = COLS.find(x => x[0] === view.key);
  const rows = scoped().filter(i => (view.st === "alle" || ST[state(i)] === view.st) && i.code.toLowerCase().includes(q))
    .sort((a, b) => { const x = c[2](a), y = c[2](b); return (typeof x === "string" ? x.localeCompare(y, "de", { numeric: true }) : x > y ? 1 : x < y ? -1 : 0) * view.dir; });
  $("cnt").textContent = "(" + rows.length + ")";
  const f = (v, g) => v == null ? "–" : eur(v), d = v => v ? fdt(v) : "–";
  $("tbl").innerHTML = rows.length ? `<table><thead><tr>${COLS.map(([k, n]) => `<th data-k="${k}" tabindex="0" class="${["buy", "sp", "ship", "g"].includes(k) ? "n " : ""}${view.key === k ? "on" : ""}" data-d="${view.dir > 0 ? "↑" : "↓"}">${n}</th>`).join("")}</tr></thead><tbody>${rows.map(i => { const g = profit(i), st = state(i);
    return `<tr><td class="code">${esc(i.code)}</td><td><span class="tag t${st}">${ST[st]}</span></td><td>${d(i.on)}</td><td>${d(i.sold)}</td><td>${i.on && i.sold ? dur(i.sold - i.on) : "–"}</td><td class="n">${f(i.buy)}</td><td class="n ${outRange(i) ? "warn" : ""}">${f(i.sp)}</td><td class="n">${f(i.ship)}</td><td class="n ${g == null ? "" : g < 0 ? "neg" : "pos"}"><b>${g == null ? "–" : eur(g)}</b></td></tr>`; }).join("")}</tbody></table>` : '<div class="empty">Keine Treffer.</div>';
}
function countUp() {
  const el = $("big"); if (!el || matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const v = +el.dataset.v, t0 = performance.now();
  (function f(t) { const p = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - p, 3); el.textContent = eur(v * e); if (p < 1) requestAnimationFrame(f); })(t0);
}

/* ---------- Aktionen ---------- */
$("tog").onclick = () => $("imp").classList.toggle("open");
$("go").onclick = () => {
  const t = $("ta").value.trim(); if (!t) { $("res").textContent = "Bitte zuerst Steckbriefe einfügen."; return; }
  const p = parse(t); if (!p.recs.length) { $("res").innerHTML = "<i>Kein Steckbrief erkannt. Jeder beginnt mit „lagercode=…“.</i>"; return; }
  const m = merge(p.recs); $("ta").value = "";
  $("res").innerHTML = `<b>${m.nw} neu</b>, ${m.up} aktualisiert` + (p.ignored ? ` · <i>${p.ignored} Zeilen nicht verstanden</i>` : "");
  render(); toast("Steckbriefe eingelesen");
};
$("demo").onclick = () => {
  if (items.some(x => !x.d)) return toast("Echte Daten vorhanden – Beispieldaten nicht geladen");
  const now = Date.now(); let seed = 7; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  for (let n = 1; n <= 36; n++) {
    const on = now - (rnd() * 26 + 1) * 864e5, buy = Math.round((3 + rnd() * 14) * 2) / 2, min = Math.round(buy * 1.8), max = min + 8, r = rnd();
    const o = { code: "LC-" + (10200 + n), min, max, on, buy, d: 1 };
    if (r < .72) { o.sold = on + (.1 + rnd() * rnd() * 14) * 864e5; if (o.sold > now) o.sold = now - 36e5; o.sold = new Date(o.sold).setHours(Math.min(23, Math.round(8 + rnd() * rnd() * 15)), Math.floor(rnd() * 60)); if (o.sold < on) o.sold = on + 36e5; if (o.sold > now) o.sold = now - 6e4; o.sp = Math.round((min - 2 + rnd() * (max - min + 5)) * 100) / 100; o.ship = [0, 3.49, 4.29, 5.19][Math.floor(rnd() * 4)]; }
    else if (r > .9) delete o.on;
    items = items.filter(x => x.code !== o.code); items.push(o);
  }
  persist(); render(); toast("Beispieldaten geladen");
};
$("wipe").onclick = () => { const b = $("wipe"); if (!items.length) return; if (!b.dataset.c) { b.dataset.c = 1; b.textContent = "Wirklich alle " + items.length + " löschen?"; clearTimeout(b.h); b.h = setTimeout(() => { delete b.dataset.c; b.textContent = "Alles löschen"; }, 3500); return; } delete b.dataset.c; b.textContent = "Alles löschen"; items = []; persist(); render(); $("res").textContent = ""; };
$("csv").onclick = () => {
  if (!items.length) return toast("Keine Daten zum Exportieren");
  const n = v => v == null ? "" : String(v).replace(".", ","), t = v => v ? fdt(v) : "";
  const rows = [["Lagercode", "Status", "Online seit", "Verkauft um", "Einkauf", "Verkauf", "Versand", "Gewinn"], ...items.map(i => [i.code, ST[state(i)], t(i.on), t(i.sold), n(i.buy), n(i.sp), n(i.ship), n(profit(i))])];
  const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(";")).join("\r\n"), a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" })); a.download = "reselling-uebersicht.csv"; a.click();
  try { navigator.clipboard.writeText(csv).then(() => toast("CSV exportiert und kopiert"), () => {}); } catch (e) {}
};
$("app").addEventListener("click", e => {
  const rg = e.target.closest("[data-days]"), th = e.target.closest("th[data-k]"), ch = e.target.closest("[data-st]");
  if (th) { view.dir = view.key === th.dataset.k ? -view.dir : -1; view.key = th.dataset.k; table(); }
  if (rg) { view.days = +rg.dataset.days; render(); }
  if (ch) { view.st = ch.dataset.st; document.querySelectorAll("[data-st]").forEach(b => b.classList.toggle("on", b === ch)); table(); }
});
$("app").addEventListener("input", e => { if (e.target.id === "q") { view.q = e.target.value; table(); } });
const BK = "rs_chef_brand"; let brand = {}; try { brand = JSON.parse(localStorage.getItem(BK) || "{}"); } catch (e) {}
const saveBrand = () => { try { localStorage.setItem(BK, JSON.stringify(brand)); } catch (e) {} };
function paintBrand() { $("bn").textContent = brand.n || "FIRMENNAME"; document.title = (brand.n ? brand.n + " – " : "") + "Chef-Übersicht"; $("logo").innerHTML = brand.l ? `<img alt="" src="${brand.l}">` : "LOGO"; }
$("bn").onblur = () => { brand.n = $("bn").textContent.trim(); saveBrand(); paintBrand(); };
$("bn").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); e.target.blur(); } };
$("logo").onclick = () => $("lf").click();
$("lf").onchange = e => { const f = e.target.files[0]; if (!f) return; const im = new Image(); im.onload = () => { const c = document.createElement("canvas"), z = Math.min(1, 96 / Math.max(im.width, im.height)); c.width = im.width * z; c.height = im.height * z; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height); brand.l = c.toDataURL("image/png"); saveBrand(); paintBrand(); }; im.src = URL.createObjectURL(f); };
$("app").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("th[data-k]")) e.target.click(); });
paintBrand(); render();
</script>
</body>
</html>
